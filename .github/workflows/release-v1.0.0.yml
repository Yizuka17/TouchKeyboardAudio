name: Publish v1.0.0

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/release-v1.0.0.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release
        shell: pwsh
        run: |
          msbuild .\TouchKeyboardAudio.csproj /m /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $exe = '.\bin\Release\TouchKeyboardAudio.exe'
          if (-not (Test-Path $exe)) { throw "Missing build output: $exe" }

      - name: Prepare release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .\dist | Out-Null
          Copy-Item .\bin\Release\TouchKeyboardAudio.exe .\dist\TouchKeyboardAudio-v1.0.0-Windows.exe -Force

          $hash = (Get-FileHash .\dist\TouchKeyboardAudio-v1.0.0-Windows.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  TouchKeyboardAudio-v1.0.0-Windows.exe" | Set-Content -Encoding ascii .\dist\SHA256SUMS.txt

          Get-Item .\dist\TouchKeyboardAudio-v1.0.0-Windows.exe | Format-List Name, Length, LastWriteTime
          Get-Content .\dist\SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = '${{ github.repository }}'
          $tag = 'v1.0.0'
          $exe = '.\dist\TouchKeyboardAudio-v1.0.0-Windows.exe'
          $sums = '.\dist\SHA256SUMS.txt'

          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --repo $repo --title 'TouchKeyboardAudio v1.0.0' --notes-file .\RELEASE_NOTES.md
            gh release upload $tag $exe $sums --repo $repo --clobber
          }
          else {
            gh release create $tag $exe $sums --repo $repo --target '${{ github.sha }}' --title 'TouchKeyboardAudio v1.0.0' --notes-file .\RELEASE_NOTES.md
          }
