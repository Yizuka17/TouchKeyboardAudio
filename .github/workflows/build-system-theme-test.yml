name: Build System Theme Test

on:
  push:
    branches: [ feature/system-theme-accent ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release
        id: build
        continue-on-error: true
        shell: pwsh
        run: |
          msbuild .\TouchKeyboardAudio.csproj /m /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU 2>&1 | Tee-Object -FilePath build-system-theme.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path '.\bin\Release\TouchKeyboardAudio.exe')) { throw 'Missing EXE' }

      - name: Upload EXE
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: TouchKeyboardAudio-SystemTheme-Test
          path: bin/Release/TouchKeyboardAudio.exe
          if-no-files-found: error
          retention-days: 7

      - name: Write status
        if: always()
        shell: pwsh
        run: |
          $status = [ordered]@{
            run_id = [long]'${{ github.run_id }}'
            run_number = [int]'${{ github.run_number }}'
            sha = '${{ github.sha }}'
            outcome = '${{ steps.build.outcome }}'
            artifact = if ('${{ steps.build.outcome }}' -eq 'success') { 'TouchKeyboardAudio-SystemTheme-Test' } else { $null }
          }
          $status | ConvertTo-Json | Set-Content -Encoding utf8 system-theme-build-status.json

      - name: Commit status
        if: always()
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add system-theme-build-status.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Update system theme build status [skip ci]"
            git push origin HEAD:feature/system-theme-accent
          }

      - name: Mark failed build
        if: steps.build.outcome != 'success'
        shell: pwsh
        run: exit 1
