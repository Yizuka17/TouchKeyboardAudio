name: Build System Theme Test

on:
  push:
    branches: [ feature/system-theme-accent ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release
        shell: pwsh
        run: |
          msbuild .\TouchKeyboardAudio.csproj /m /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path '.\bin\Release\TouchKeyboardAudio.exe')) { throw 'Missing EXE' }

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: TouchKeyboardAudio-SystemTheme-Test
          path: bin/Release/TouchKeyboardAudio.exe
          if-no-files-found: error
          retention-days: 7
