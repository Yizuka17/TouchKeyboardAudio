name: Build genuine UWP package

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-uwp:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build desktop backend
        shell: pwsh
        run: |
          msbuild .\TouchKeyboardAudio.csproj /m /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path .\bin\Release\TouchKeyboardAudio.exe)) {
            throw 'Desktop backend output is missing.'
          }

      - name: Create temporary signing certificate
        shell: pwsh
        run: |
          $password = 'TouchKeyboardAudio-CI'
          $secure = ConvertTo-SecureString $password -AsPlainText -Force
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject 'CN=Yizuka17' `
            -KeyUsage DigitalSignature `
            -FriendlyName 'TouchKeyboardAudio CI' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3','2.5.29.19={text}')

          Export-PfxCertificate -Cert $cert -FilePath .\TouchKeyboardAudio.Uwp\TouchKeyboardAudio.pfx -Password $secure | Out-Null
          Export-Certificate -Cert $cert -FilePath .\TouchKeyboardAudio.Uwp\TouchKeyboardAudio.cer | Out-Null
          "TKA_CERT_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore UWP packages
        shell: pwsh
        run: |
          msbuild .\TouchKeyboardAudio.Uwp\TouchKeyboardAudio.Uwp.csproj /t:Restore /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build signed UWP package
        shell: pwsh
        run: |
          $packageDir = Join-Path $PWD 'TouchKeyboardAudio.Uwp\AppPackages\'
          msbuild .\TouchKeyboardAudio.Uwp\TouchKeyboardAudio.Uwp.csproj `
            /m `
            /t:Rebuild `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:GenerateAppxPackageOnBuild=true `
            /p:AppxBundle=Never `
            /p:AppxPackageDir="$packageDir" `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateKeyFile="$PWD\TouchKeyboardAudio.Uwp\TouchKeyboardAudio.pfx" `
            /p:PackageCertificatePassword="$env:TKA_CERT_PASSWORD"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Get-ChildItem .\TouchKeyboardAudio.Uwp\AppPackages -Recurse | Select-Object FullName, Length

      - name: Copy test certificate next to package
        shell: pwsh
        run: |
          Copy-Item .\TouchKeyboardAudio.Uwp\TouchKeyboardAudio.cer .\TouchKeyboardAudio.Uwp\AppPackages\TouchKeyboardAudio-TestCertificate.cer -Force

      - name: Upload UWP package
        uses: actions/upload-artifact@v4
        with:
          name: TouchKeyboardAudio-UWP
          path: TouchKeyboardAudio.Uwp/AppPackages/**
          if-no-files-found: error
          retention-days: 30
