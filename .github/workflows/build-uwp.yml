name: Build and release genuine UWP package

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-uwp:
    runs-on: windows-2022
    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read package version
        id: meta
        shell: pwsh
        run: |
          [xml]$manifest = Get-Content .\TouchKeyboardAudio.Uwp\Package.appxmanifest
          $version = $manifest.Package.Identity.Version
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Package version is missing.' }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "TKA_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build desktop backend
        shell: pwsh
        run: |
          msbuild .\TouchKeyboardAudio.csproj /m /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path .\bin\Release\TouchKeyboardAudio.exe)) {
            throw 'Desktop backend output is missing.'
          }

      - name: Create 10-year signing certificate
        shell: pwsh
        run: |
          $password = 'TouchKeyboardAudio-CI'
          $secure = ConvertTo-SecureString $password -AsPlainText -Force
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject 'CN=Yizuka17' `
            -KeyUsage DigitalSignature `
            -FriendlyName 'TouchKeyboardAudio Release' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -NotAfter (Get-Date).AddYears(10) `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3','2.5.29.19={text}')

          Export-PfxCertificate -Cert $cert -FilePath .\TouchKeyboardAudio.Uwp\TouchKeyboardAudio.pfx -Password $secure | Out-Null
          Export-Certificate -Cert $cert -FilePath .\TouchKeyboardAudio.Uwp\TouchKeyboardAudio.cer | Out-Null
          "TKA_CERT_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Certificate valid until $($cert.NotAfter.ToString('u'))"

      - name: Restore UWP packages
        shell: pwsh
        run: |
          msbuild .\TouchKeyboardAudio.Uwp\TouchKeyboardAudio.Uwp.csproj /t:Restore /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build signed UWP package
        shell: pwsh
        run: |
          $packageDir = Join-Path $PWD 'TouchKeyboardAudio.Uwp\AppPackages\'
          msbuild .\TouchKeyboardAudio.Uwp\TouchKeyboardAudio.Uwp.csproj `
            /m `
            /t:Rebuild `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:GenerateAppxPackageOnBuild=true `
            /p:AppxBundle=Never `
            /p:AppxPackageDir="$packageDir" `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateKeyFile="$PWD\TouchKeyboardAudio.Uwp\TouchKeyboardAudio.pfx" `
            /p:PackageCertificatePassword="$env:TKA_CERT_PASSWORD"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Get-ChildItem .\TouchKeyboardAudio.Uwp\AppPackages -Recurse | Select-Object FullName, Length

      - name: Copy certificate and create release archive
        shell: pwsh
        run: |
          Copy-Item .\TouchKeyboardAudio.Uwp\TouchKeyboardAudio.cer .\TouchKeyboardAudio.Uwp\AppPackages\TouchKeyboardAudio-TestCertificate.cer -Force
          $zip = ".\TouchKeyboardAudio.Uwp\TouchKeyboardAudio-UWP-v$env:TKA_VERSION.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path .\TouchKeyboardAudio.Uwp\AppPackages\* -DestinationPath $zip -CompressionLevel Optimal
          if (-not (Test-Path $zip)) { throw 'Release archive was not created.' }

      - name: Upload UWP package
        uses: actions/upload-artifact@v4
        with:
          name: TouchKeyboardAudio-UWP
          path: |
            TouchKeyboardAudio.Uwp/AppPackages/**
            TouchKeyboardAudio.Uwp/TouchKeyboardAudio-UWP-v*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-uwp
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: TouchKeyboardAudio-UWP
          path: release-files

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build-uwp.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          zip="$(find release-files -type f -name "TouchKeyboardAudio-UWP-v${VERSION}.zip" -print -quit)"
          if [ -z "$zip" ]; then
            echo "Release archive not found"
            exit 1
          fi

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; skipping."
            exit 0
          fi

          cat > release-notes.md <<'EOF'
          Genuine Windows 10 UWP frontend for TouchKeyboardAudio.

          - Real UWP/AppContainer XAML frontend with packaged full-trust backend.
          - Transparent high-DPI product icon assets for Start/taskbar/high-DPI displays.
          - Persists the applied dB state across app restarts.
          - Cleans UWP bridge files and orphaned Float32 temporary WAV files.
          - Keeps the original Microsoft PCM16 safety backups for one-click restore.
          - Release package is signed with a self-signed certificate valid for 10 years.

          Installation: extract the ZIP, install/trust the included TouchKeyboardAudio-TestCertificate.cer if Windows asks, then run the included package installer/Install.ps1.
          EOF

          gh release create "$tag" "$zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "TouchKeyboardAudio $tag" \
            --notes-file release-notes.md
